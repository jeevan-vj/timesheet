# Signed-in no-workspace smoke.
# Load MAESTRO_EMAIL and MAESTRO_PASSWORD from the environment, not -e.
# Synthetic local or disposable accounts only. See .maestro/README.md.
# testID is apps/mobile/src/app/(none)/index.tsx.
appId: ${APP_ID || "nz.co.jnok.cleantrack.dev"}
---
- launchApp
- tapOn:
    id: "sign-in-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
- assertVisible:
    id: "no-workspace"
- assertVisible: "No workspace yet"
- assertNotVisible: "Something went wrong"
