name: Factory E2E Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: factory-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    if: github.event.pull_request.draft == false
    name: Factory E2E evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FACTORY_E2E_REPOSITORY: ${{ github.repository }}
      FACTORY_E2E_PR: ${{ github.event.pull_request.number }}
      FACTORY_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FACTORY_E2E_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Configure isolated local app
        run: |
          set -euo pipefail
          printf 'BETTER_AUTH_SECRET=local-development-secret-change-me-123456789\nBETTER_AUTH_URL=%s\nAUTH_TRUSTED_ORIGINS=%s\n' \
            "$FACTORY_E2E_BASE_URL" "$FACTORY_E2E_BASE_URL" > .dev.vars
          cp .dev.vars dist/server/.dev.vars
          pnpm exec wrangler d1 migrations apply cleantrack-timesheet --local --config wrangler.jsonc --persist-to .wrangler/e2e-state
      - name: Start PR-head app
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --config dist/server/wrangler.json --ip 127.0.0.1 --port 8787 --persist-to .wrangler/e2e-state \
            --var "BETTER_AUTH_URL:${FACTORY_E2E_BASE_URL}" \
            --var "AUTH_TRUSTED_ORIGINS:${FACTORY_E2E_BASE_URL}" \
            --var "RELEASE_SHA:factory-e2e" \
            > "$RUNNER_TEMP/wrangler-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wrangler-e2e.pid"
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail "$FACTORY_E2E_BASE_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "PR-head app did not become healthy"
          tail -n 100 "$RUNNER_TEMP/wrangler-e2e.log" || true
          exit 1
      - name: Run browser scenarios
        run: node .factory/e2e/harness.mjs --base-url "$FACTORY_E2E_BASE_URL" --out factory-e2e-output --repository "$FACTORY_E2E_REPOSITORY" --pr "$FACTORY_E2E_PR" --head-sha "$FACTORY_E2E_HEAD_SHA"
      - name: Evaluate evidence with the factory consumer
        run: |
          node .factory/evaluate-e2e-evidence.mjs \
            --repository "$FACTORY_E2E_REPOSITORY" \
            --pr "$FACTORY_E2E_PR" \
            --head-sha "$FACTORY_E2E_HEAD_SHA" \
            --artifact-dir factory-e2e-output \
            --run-conclusion success \
            --run-head-sha "$FACTORY_E2E_HEAD_SHA" \
            --run-event "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}"
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: factory-e2e-evidence-${{ github.event.pull_request.head.sha }}
          path: factory-e2e-output
          if-no-files-found: error
          retention-days: 14
      - name: Stop PR-head app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/wrangler-e2e.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/wrangler-e2e.pid")" 2>/dev/null || true
          fi
