name: Factory Repair Loop

on:
  workflow_run:
    workflows: [Factory PR Gate, Factory Review Signal]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: factory-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted factory policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .factory
      - name: Route CI or review feedback
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          pr="$(printf '%s' "$RUN_PRS" | jq -r '.[0].number // empty')"
          if [ -z "$pr" ]; then [ -n "$HEAD_BRANCH" ] || exit 0; pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"; fi
          [ -n "$pr" ] || exit 0

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr")"
          head="$(printf '%s' "$pr_json" | jq -r .head.sha)"
          head_repo="$(printf '%s' "$pr_json" | jq -r .head.repo.full_name)"
          body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"
          [ "$head_repo" = "$REPOSITORY" ] || exit 0
          issue="$(printf '%s' "$body" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          [ -n "$issue" ] || exit 0
          delegated="$(gh api "repos/$REPOSITORY/issues/$issue" --jq '[.labels[].name] | any(. == "factory:delegated")')"
          [ "$delegated" = true ] || exit 0

          reason=""
          kind=""
          source=""
          if [ "$RUN_NAME" = "Factory PR Gate" ] && [ "$RUN_CONCLUSION" != success ]; then
            [ "$head" = "$RUN_HEAD_SHA" ] || exit 0
            kind="ci"
            source="gate"
            reason="The deterministic PR gate concluded $RUN_CONCLUSION for commit $head. Inspect the failing checks at $RUN_URL and fix only failures caused by this PR."
          elif [ "$RUN_NAME" = "Factory Review Signal" ] && [ "$RUN_CONCLUSION" = success ]; then
            reviews="$RUNNER_TEMP/reviews.json"
            review_comments="$RUNNER_TEMP/review-comments.json"
            gh api --paginate "repos/$REPOSITORY/pulls/$pr/reviews?per_page=100" | jq -s '[.[][]]' > "$reviews"
            gh api --paginate "repos/$REPOSITORY/pulls/$pr/comments?per_page=100" | jq -s '[.[][]]' > "$review_comments"
            selected="$(node --input-type=module -e 'import fs from "node:fs"; import {selectActionableFactoryReview} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const comments=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); process.stdout.write(JSON.stringify(selectActionableFactoryReview(reviews,comments,process.argv[3])||{}));' "$reviews" "$review_comments" "$head")"
            review_id="$(printf '%s' "$selected" | jq -r '.id // empty')"
            review_head="$(printf '%s' "$selected" | jq -r '.commit_id // empty')"
            [ -n "$review_id" ] && [ "$review_head" = "$head" ] || exit 0
            kind="review"
            source="review-$review_id"
            review_feedback="$(printf '%s' "$selected" | jq -r '.blockingFindings | join("\n\n")')"
            reason="$(printf 'The trusted independent review reported blocking P0/P1/P2 findings on commit %s. Inspect all review comments and address only confirmed findings.\n\n%s' "$head" "$review_feedback")"
          else
            exit 0
          fi

          marker="<!-- factory-repair:$head:$kind:$source -->"
          blocked_marker="<!-- factory-repair-blocked:$head:$kind:$source -->"
          comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$REPOSITORY/issues/$issue/comments?per_page=100" | jq -s '[.[][]]' > "$comments"
          trusted_comments="$RUNNER_TEMP/trusted-issue-comments.json"
          jq '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot")]' "$comments" > "$trusted_comments"
          already="$(jq --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))] | length' "$trusted_comments")"
          [ "$already" -eq 0 ] || exit 0
          attempts="$(jq '[.[] | select((.body // "") | startswith("Automated repair cycle ") and contains(" dispatched."))] | length' "$trusted_comments")"
          if [ "$attempts" -ge 2 ]; then
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$issue" --repo "$REPOSITORY" --body "Automated repair stopped after two successfully dispatched cycles. Human investigation is required.\n\n$blocked_marker"
            exit 0
          fi

          agent_id="$(jq -r '[.[] | (.body // "") | try capture("factory-agent-id:(?<id>bc-[A-Za-z0-9-]+)").id catch empty] | last // empty' "$trusted_comments")"
          if [ -z "$agent_id" ] || [ -z "${CURSOR_API_KEY:-}" ]; then
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$issue" --repo "$REPOSITORY" --body "Automated repair could not start because the durable Cursor agent or API key is unavailable.\n\n$blocked_marker"
            exit 0
          fi

          reason_file="$RUNNER_TEMP/repair-reason.txt"
          payload="$RUNNER_TEMP/followup-payload.json"
          printf '%s' "$reason" > "$reason_file"
          node .factory/followup-cursor.mjs --dry-run --agent "$agent_id" --repo "$REPOSITORY" --issue "$issue" --pr "$pr" --head "$head" --reason-file "$reason_file" > "$payload"

          status=""
          for poll in {1..40}; do
            current_head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq .head.sha)"
            if [ "$current_head" != "$head" ]; then
              echo "Repair feedback is stale because the PR head advanced to $current_head."
              exit 0
            fi

            runs_status="$(curl --silent --show-error --output "$RUNNER_TEMP/runs.json" --write-out '%{http_code}' \
              "https://api.cursor.com/v1/agents/$agent_id/runs?limit=1" \
              --header "Authorization: Bearer $CURSOR_API_KEY")"
            if [[ ! "$runs_status" =~ ^2[0-9][0-9]$ ]]; then status="$runs_status"; break; fi
            active="$(jq -r '(.items[0].status // "") | ascii_upcase | test("^(CREATING|RUNNING)$")' "$RUNNER_TEMP/runs.json")"
            if [ "$active" = true ]; then
              status=409
            else
              status="$(curl --silent --show-error --output "$RUNNER_TEMP/followup.json" --write-out '%{http_code}' \
                --request POST "https://api.cursor.com/v1/agents/$agent_id/runs" \
                --header "Authorization: Bearer $CURSOR_API_KEY" \
                --header 'Content-Type: application/json' \
                --data-binary "@$payload")"
              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then break; fi
              error_code="$(jq -r '.error.code // .code // empty' "$RUNNER_TEMP/followup.json" 2>/dev/null || true)"
              [ "$status" = 409 ] && [ "$error_code" = agent_busy ] || break
            fi
            if [ "$poll" -lt 40 ]; then sleep 30; fi
          done

          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body "Automated repair cycle $((attempts + 1)) dispatched.\n\n$marker"
          else
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$issue" --repo "$REPOSITORY" --body "Automated repair could not be queued after waiting for the durable agent (Cursor status ${status:-unknown}). Human intervention or a workflow rerun is required.\n\n$blocked_marker"
          fi
