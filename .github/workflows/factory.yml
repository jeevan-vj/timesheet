name: Factory Intake
on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number: { description: "Issue number", required: true, type: string }
permissions:
  contents: read
  issues: write
concurrency:
  group: factory-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true
jobs:
  intake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && (
        (github.event.action == 'labeled' && github.event.label.name == 'factory:ready') ||
        ((github.event.action == 'opened' || github.event.action == 'reopened') && contains(join(github.event.issue.labels.*.name, ','), 'factory:ready'))
      )) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, '@codex'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: .factory
      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NUMBER: ${{ github.event.issue.number }}
          EVENT_TITLE: ${{ github.event.issue.title }}
          EVENT_BODY: ${{ github.event.issue.body }}
          EVENT_LABELS: ${{ toJson(github.event.issue.labels) }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            issue="$INPUT_NUMBER"
            json="$(gh api "repos/$REPOSITORY/issues/$issue")"
            title="$(printf '%s' "$json" | jq -r .title)"
            body="$(printf '%s' "$json" | jq -r '.body // ""')"
            labels="$(printf '%s' "$json" | jq -c '[.labels[].name]')"
            handoff_text="$body"
          elif [ "$EVENT_NAME" = issue_comment ]; then
            issue="$EVENT_NUMBER"
            title="$EVENT_TITLE"
            body="$EVENT_BODY"
            labels="$(printf '%s' "${EVENT_LABELS:-[]}" | jq -c '[.[]?.name // empty]')"
            handoff_text="$COMMENT_BODY"
          else
            issue="$EVENT_NUMBER"
            title="$EVENT_TITLE"
            body="$EVENT_BODY"
            labels="$(printf '%s' "${EVENT_LABELS:-[]}" | jq -c '[.[]?.name // empty]')"
            handoff_text="$body"
            if [ "$EVENT_ACTION" = labeled ]; then
              labels="$(printf '%s' "$labels" | jq -c '. + ["factory:ready"] | unique')"
            fi
          fi
          {
            echo "number=$issue"
            echo "title<<EOF"
            printf '%s\n' "$title"
            echo EOF
            echo "body<<EOF"
            printf '%s\n' "$body"
            echo EOF
            echo "labels=$labels"
            echo "handoff_text<<EOF"
            printf '%s\n' "$handoff_text"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Detect handoff
        id: gate
        env:
          LABELS: ${{ steps.issue.outputs.labels }}
          HANDOFF_TEXT: ${{ steps.issue.outputs.handoff_text }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          labels_file="$RUNNER_TEMP/factory-labels.json"
          text_file="$RUNNER_TEMP/factory-handoff.txt"
          payload_file="$RUNNER_TEMP/factory-handoff.json"
          printf '%s' "${LABELS:-[]}" > "$labels_file"
          printf '%s' "$HANDOFF_TEXT" > "$text_file"
          jq -n --slurpfile labels "$labels_file" --rawfile text "$text_file" \
            '{labels: ($labels[0] // []), text: $text}' > "$payload_file"
          result="$(node .factory/handoff.mjs < "$payload_file")"
          delegated="$(printf '%s' "$result" | jq -r .delegated)"
          provider="$(printf '%s' "$result" | jq -r '.provider // ""')"
          if [ "$FORCE" = true ] && [ "$delegated" != true ]; then
            delegated=true
            provider=cursor
          fi
          echo "delegated=$delegated" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Dispatch Cursor Cloud Agent
        if: steps.gate.outputs.delegated == 'true' && steps.gate.outputs.provider == 'cursor'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
          TITLE: ${{ steps.issue.outputs.title }}
          BODY: ${{ steps.issue.outputs.body }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          for spec in 'factory:ready|0E8A16' 'factory:delegated|1D76DB' 'factory:implementing|5319E7' 'factory:needs-human|D93F0B' 'factory:complete|2DA44E'; do IFS='|' read -r name color <<< "$spec"; gh label create "$name" --repo "$REPOSITORY" --color "$color" --force >/dev/null; done

          comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq -s '[.[][]]' > "$comments"
          existing_agent="$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | (.body // "") | try capture("factory-agent-id:(?<id>bc-[A-Za-z0-9-]+)").id catch empty] | last // empty' "$comments")"
          if [ "$FORCE" != true ] && [ -n "$existing_agent" ]; then
            echo "Skipping dispatch; durable factory agent already recorded ($existing_agent)."
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:ready || true
            exit 0
          fi

          gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:delegated --remove-label factory:ready || true
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:implementing || true
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body 'Factory intake accepted (`factory:ready`), but `CURSOR_API_KEY` is not configured. Add it in repository Actions secrets and re-apply the `factory:ready` label.'
            exit 0
          fi
          body_file="$RUNNER_TEMP/issue.md"; printf '%s' "$BODY" > "$body_file"
          gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:implementing
          if ! output="$(node .factory/dispatch-cursor.mjs --repo "$REPOSITORY" --issue "$ISSUE" --title "$TITLE" --body-file "$body_file" --ref "${{ github.event.repository.default_branch }}")"; then
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:implementing || true
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body 'Cursor dispatch was accepted or attempted, but the factory could not verify the durable agent through the Cursor Agents API. No durable agent was recorded. Re-apply `factory:ready` or use workflow_dispatch after investigating the Cursor API/account configuration.'
            exit 0
          fi
          agent_id="$(printf '%s' "$output" | jq -r '.agent.id // .id // .run.agentId // empty')"
          verified_id="$(printf '%s' "$output" | jq -r '.factoryVerification.id // empty')"
          verified_url="$(printf '%s' "$output" | jq -r '.factoryVerification.url // empty')"
          run_id="$(printf '%s' "$output" | jq -r '.factoryVerification.runId // empty')"
          run_status="$(printf '%s' "$output" | jq -r '.factoryVerification.runStatus // empty')"
          if [ -z "$agent_id" ] || [ "$verified_id" != "$agent_id" ]; then
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:implementing || true
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body 'Cursor returned an agent response, but the factory could not verify the same durable agent ID through `GET /v1/agents/{id}`. Automated repair follow-ups are disabled until intake is retried.'
            exit 0
          fi
          canonical_url="https://cursor.com/agents/$agent_id"
          comment_file="$RUNNER_TEMP/factory-agent-comment.md"
          {
            printf 'Cursor Cloud Agent API-verified: %s\n\n' "$canonical_url"
            printf 'Factory intake used the `factory:ready` label via Actions (Agents API).'
            if [ -n "$run_id" ]; then printf ' Initial run: `%s`' "$run_id"; fi
            if [ -n "$run_status" ]; then printf ' (`%s`)' "$run_status"; fi
            printf '\n\nThe API key may belong to a service account, so whether this URL is visible in your personal Cursor dashboard depends on Cursor account access. Factory repair follows the API-verified agent ID, not browser visibility.\n\n'
            printf '<!-- factory-agent-id:%s -->\n' "$agent_id"
          } > "$comment_file"
          gh issue comment "$ISSUE" --repo "$REPOSITORY" --body-file "$comment_file"
      - name: Record Codex handoff
        if: steps.gate.outputs.delegated == 'true' && steps.gate.outputs.provider == 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:delegated --remove-label factory:ready || true
