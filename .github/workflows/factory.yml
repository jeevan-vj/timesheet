name: Factory Intake
on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number: { description: "Issue number", required: true, type: string }
permissions:
  contents: read
  issues: write
jobs:
  intake:
    concurrency:
      group: factory-intake-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && (
        (github.event.action == 'labeled' && github.event.label.name == 'factory:ready') ||
        ((github.event.action == 'opened' || github.event.action == 'reopened') && contains(join(github.event.issue.labels.*.name, ','), 'factory:ready'))
      )) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, '@codex'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: .factory
      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NUMBER: ${{ github.event.issue.number }}
          EVENT_TITLE: ${{ github.event.issue.title }}
          EVENT_BODY: ${{ github.event.issue.body }}
          EVENT_LABELS: ${{ toJson(github.event.issue.labels) }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            issue="$INPUT_NUMBER"
            json="$(gh api "repos/$REPOSITORY/issues/$issue")"
            title="$(printf '%s' "$json" | jq -r .title)"
            body="$(printf '%s' "$json" | jq -r '.body // ""')"
            labels="$(printf '%s' "$json" | jq -c '[.labels[].name]')"
            handoff_text="$body"
          elif [ "$EVENT_NAME" = issue_comment ]; then
            issue="$EVENT_NUMBER"
            title="$EVENT_TITLE"
            body="$EVENT_BODY"
            labels="$(printf '%s' "${EVENT_LABELS:-[]}" | jq -c '[.[]?.name // empty]')"
            handoff_text="$COMMENT_BODY"
          else
            issue="$EVENT_NUMBER"
            title="$EVENT_TITLE"
            body="$EVENT_BODY"
            labels="$(printf '%s' "${EVENT_LABELS:-[]}" | jq -c '[.[]?.name // empty]')"
            handoff_text="$body"
            if [ "$EVENT_ACTION" = labeled ]; then
              labels="$(printf '%s' "$labels" | jq -c '. + ["factory:ready"] | unique')"
            fi
          fi
          {
            echo "number=$issue"
            echo "title<<EOF"
            printf '%s\n' "$title"
            echo EOF
            echo "body<<EOF"
            printf '%s\n' "$body"
            echo EOF
            echo "labels=$labels"
            echo "handoff_text<<EOF"
            printf '%s\n' "$handoff_text"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Detect handoff
        id: gate
        env:
          LABELS: ${{ steps.issue.outputs.labels }}
          HANDOFF_TEXT: ${{ steps.issue.outputs.handoff_text }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          labels_file="$RUNNER_TEMP/factory-labels.json"
          text_file="$RUNNER_TEMP/factory-handoff.txt"
          payload_file="$RUNNER_TEMP/factory-handoff.json"
          printf '%s' "${LABELS:-[]}" > "$labels_file"
          printf '%s' "$HANDOFF_TEXT" > "$text_file"
          jq -n --slurpfile labels "$labels_file" --rawfile text "$text_file" \
            '{labels: ($labels[0] // []), text: $text}' > "$payload_file"
          result="$(node .factory/handoff.mjs < "$payload_file")"
          delegated="$(printf '%s' "$result" | jq -r .delegated)"
          provider="$(printf '%s' "$result" | jq -r '.provider // ""')"
          if [ "$FORCE" = true ] && [ "$delegated" != true ]; then
            delegated=true
            provider=cursor
          fi
          echo "delegated=$delegated" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Canonical factory run
        id: plane
        if: steps.gate.outputs.delegated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
          PROVIDER: ${{ steps.gate.outputs.provider }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          RELABELLED: ${{ github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'factory:ready' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_STALE_RUN_HOURS: ${{ vars.FACTORY_STALE_RUN_HOURS }}
        run: |
          set -euo pipefail
          comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq -s '[.[][]]' > "$comments"
          agent_file="$RUNNER_TEMP/factory-agent.json"
          printf 'null\n' > "$agent_file"
          comment_agent="$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | (.body // "") | try capture("factory-agent-id:(?<id>bc-[A-Za-z0-9-]+)").id catch empty] | last // empty' "$comments")"
          plane_agent=""
          plane_ok=false
          parsed="$RUNNER_TEMP/factory-parsed.json"
          jq -n --slurpfile comments "$comments" '{comments:($comments[0] // [])}' > "$RUNNER_TEMP/factory-parse.json"
          if node .factory/control-plane.mjs parse "$RUNNER_TEMP/factory-parse.json" > "$parsed"; then
            plane_ok="$(jq -r '.ok // false' "$parsed")"
            if [ "$plane_ok" = true ]; then
              plane_agent="$(jq -r '.run.agent_id // empty' "$parsed")"
            fi
          fi
          if [ "$plane_ok" = true ] && [ "$plane_agent" != "$comment_agent" ] && { [ -n "$plane_agent" ] || [ -n "$comment_agent" ]; }; then
            echo "Factory agent id mismatch: run.agent_id=${plane_agent:-none} latest factory-agent-id comment=${comment_agent:-none}" >&2
          fi
          if [ -n "${CURSOR_API_KEY:-}" ] && [ -n "$plane_agent" ]; then
            if ! node .factory/dispatch-cursor.mjs --inspect-agent "$plane_agent" > "$agent_file"; then
              printf '%s\n' '{"lookupFailed":true}' > "$agent_file"
            fi
          fi
          relabelled=false
          if [ "$RELABELLED" = true ]; then relabelled=true; fi
          payload="$RUNNER_TEMP/factory-intake.json"
          jq -n --slurpfile comments "$comments" --slurpfile agent "$agent_file" --arg repo "$REPOSITORY" --arg issue "$ISSUE" --arg provider "$PROVIDER" --arg staleHours "$FACTORY_STALE_RUN_HOURS" --argjson force "$( [ "$FORCE" = true ] && echo true || echo false )" --argjson relabelled "$relabelled" \
            '{comments:($comments[0] // []), repository:$repo, issue:($issue|tonumber), provider:$provider, force:$force, relabelled:$relabelled, staleHours:$staleHours, agentRetirement:null, agent:($agent[0] // null), actor:{type:"workflow",name:"Factory Intake",harness:(if $provider == "codex" then "codex" else "cursor" end)}}' > "$payload"
          result="$RUNNER_TEMP/factory-plane.json"
          node .factory/control-plane.mjs intake "$payload" > "$result"
          ok="$(jq -r '.ok' "$result")"
          action="$(jq -r '.action // empty' "$result")"
          if [ "$action" = retire_agent ]; then
            retire_agent="$(jq -r '.retire_agent_id // empty' "$result")"
            retire_run="$(jq -r '.retire_run_id // empty' "$result")"
            retire_status="$(jq -r '.retire_run_status // empty' "$result")"
            disposition=left_running
            if [ -n "$retire_agent" ] && [ "$retire_agent" != null ]; then
              retire_args=(--retire-agent "$retire_agent")
              if [ -n "$retire_run" ] && [ "$retire_run" != null ]; then
                retire_args+=(--retire-run "$retire_run")
              fi
              if [ -n "$retire_status" ] && [ "$retire_status" != null ]; then
                retire_args+=(--retire-run-status "$retire_status")
              fi
              if node .factory/dispatch-cursor.mjs "${retire_args[@]}"; then
                disposition=retired
              else
                echo "Cursor agent could not be cancelled or archived; recording old_agent_left_running." >&2
              fi
            else
              echo "Cursor agent could not be cancelled or archived; recording old_agent_left_running." >&2
            fi
            jq --arg disposition "$disposition" '.agentRetirement = $disposition' "$payload" > "$RUNNER_TEMP/factory-intake-retry.json"
            node .factory/control-plane.mjs intake "$RUNNER_TEMP/factory-intake-retry.json" > "$result"
            ok="$(jq -r '.ok' "$result")"
            action="$(jq -r '.action // empty' "$result")"
          fi
          run_id="$(jq -r '.factory_run_id // empty' "$result")"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human || true
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body "Factory intake failed closed (\`$(jq -r '.code // "unknown"' "$result")\`). Canonical factory state is missing or invalid; GitHub labels are not the source of truth."
            exit 0
          fi
          if [ "$action" = cancel_and_recreate ] || [ "$action" = supersede ]; then
            prev_file="$RUNNER_TEMP/factory-status-previous.md"
            jq -r '.previous_status_markdown' "$result" > "$prev_file"
            prev_id="$(jq -r '.previous_status_comment_id // empty' "$result")"
            if [ -n "$prev_id" ] && [ "$prev_id" != null ]; then
              jq -n --rawfile body "$prev_file" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$prev_id" --input - >/dev/null
            fi
          fi
          body_file="$RUNNER_TEMP/factory-status.md"
          jq -r '.status_markdown' "$result" > "$body_file"
          comment_id="$(jq -r '.status_comment_id // empty' "$result")"
          if [ -n "$comment_id" ] && [ "$comment_id" != null ]; then
            jq -n --rawfile body "$body_file" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          else
            jq -n --rawfile body "$body_file" '{body:$body}' | gh api --method POST "repos/$REPOSITORY/issues/$ISSUE/comments" --input - >/dev/null
          fi
          add_labels="$(jq -r '.labels.add | join(",")' "$result")"
          [ -n "$add_labels" ] && gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label "$add_labels" || true
          jq -r '.labels.remove[]' "$result" | while IFS= read -r label; do
            [ -n "$label" ] && gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label "$label" || true
          done
      - name: Dispatch Cursor Cloud Agent
        if: steps.gate.outputs.delegated == 'true' && steps.gate.outputs.provider == 'cursor' && steps.plane.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
          TITLE: ${{ steps.issue.outputs.title }}
          BODY: ${{ steps.issue.outputs.body }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          FACTORY_RUN_ID: ${{ steps.plane.outputs.run_id }}
          PLANE_ACTION: ${{ steps.plane.outputs.action }}
        run: |
          set -euo pipefail
          for spec in 'factory:ready|0E8A16' 'factory:delegated|1D76DB' 'factory:implementing|5319E7' 'factory:needs-human|D93F0B' 'factory:complete|2DA44E'; do IFS='|' read -r name color <<< "$spec"; gh label create "$name" --repo "$REPOSITORY" --color "$color" --force >/dev/null; done

          comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq -s '[.[][]]' > "$comments"
          existing_agent="$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | (.body // "") | try capture("factory-agent-id:(?<id>bc-[A-Za-z0-9-]+)").id catch empty] | last // empty' "$comments")"
          if [ "$PLANE_ACTION" = retire_agent ]; then
            echo "Refusing dispatch; previous agent retirement did not finish." >&2
            exit 1
          fi
          if [ "$PLANE_ACTION" = skip ]; then
            echo "Skipping dispatch; durable factory agent already recorded (${existing_agent:-$FACTORY_RUN_ID})."
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:ready || true
            exit 0
          fi
          if [ "$FORCE" != true ] && [ -n "$existing_agent" ] && [ "$PLANE_ACTION" != supersede ]; then
            echo "Skipping dispatch; durable factory agent already recorded ($existing_agent)."
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:ready || true
            exit 0
          fi

          record_plane_failure() {
            local kind="$1"
            gh api --paginate "repos/$REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq -s '[.[][]]' > "$comments"
            jq -n --slurpfile comments "$comments" --arg kind "$kind" '{comments:($comments[0] // []), kind:$kind, actor:{type:"workflow",name:"Factory Intake",harness:"cursor"}}' > "$RUNNER_TEMP/factory-intake-failure.json"
            if node .factory/control-plane.mjs intake-failure "$RUNNER_TEMP/factory-intake-failure.json" > "$RUNNER_TEMP/factory-intake-failure-result.json"; then
              if [ "$(jq -r .ok "$RUNNER_TEMP/factory-intake-failure-result.json")" = true ]; then
                jq -r .status_markdown "$RUNNER_TEMP/factory-intake-failure-result.json" > "$RUNNER_TEMP/factory-status.md"
                cid="$(jq -r '.status_comment_id // empty' "$RUNNER_TEMP/factory-intake-failure-result.json")"
                if [ -n "$cid" ] && [ "$cid" != null ]; then
                  jq -n --rawfile body "$RUNNER_TEMP/factory-status.md" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$cid" --input - >/dev/null
                fi
              fi
            fi
          }

          gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:delegated --remove-label factory:ready || true
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            record_plane_failure dispatch_auth
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:implementing || true
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body 'Factory intake accepted (`factory:ready`), but `CURSOR_API_KEY` is not configured. Add it in repository Actions secrets and re-apply the `factory:ready` label.'
            exit 0
          fi
          body_file="$RUNNER_TEMP/issue.md"; printf '%s' "$BODY" > "$body_file"
          gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:implementing
          if ! output="$(node .factory/dispatch-cursor.mjs --repo "$REPOSITORY" --issue "$ISSUE" --title "$TITLE" --body-file "$body_file" --ref "${{ github.event.repository.default_branch }}" --factory-run-id "$FACTORY_RUN_ID")"; then
            record_plane_failure dispatch_verify
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:implementing || true
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body 'Cursor dispatch was accepted or attempted, but the factory could not verify the durable agent through the Cursor Agents API. No durable agent was recorded. Re-apply `factory:ready` or use workflow_dispatch after investigating the Cursor API/account configuration.'
            exit 0
          fi
          agent_id="$(printf '%s' "$output" | jq -r '.agent.id // .id // .run.agentId // empty')"
          verified_id="$(printf '%s' "$output" | jq -r '.factoryVerification.id // empty')"
          verified_url="$(printf '%s' "$output" | jq -r '.factoryVerification.url // empty')"
          cursor_run_id="$(printf '%s' "$output" | jq -r '.factoryVerification.runId // empty')"
          run_status="$(printf '%s' "$output" | jq -r '.factoryVerification.runStatus // empty')"
          if [ -z "$agent_id" ] || [ "$verified_id" != "$agent_id" ]; then
            record_plane_failure dispatch_verify
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --remove-label factory:implementing || true
            gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:needs-human
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body 'Cursor returned an agent response, but the factory could not verify the same durable agent ID through `GET /v1/agents/{id}`. Automated repair follow-ups are disabled until intake is retried.'
            exit 0
          fi
          gh api --paginate "repos/$REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq -s '[.[][]]' > "$comments"
          jq -n --slurpfile comments "$comments" --arg agent "$agent_id" --arg cursor_run "$cursor_run_id" --arg factory_run "$FACTORY_RUN_ID" '{comments:($comments[0] // []), agent_id:$agent, cursor_run_id:$cursor_run, factory_run_id:$factory_run}' > "$RUNNER_TEMP/factory-associate.json"
          if node .factory/control-plane.mjs associate "$RUNNER_TEMP/factory-associate.json" > "$RUNNER_TEMP/factory-associate-result.json"; then
            if [ "$(jq -r .ok "$RUNNER_TEMP/factory-associate-result.json")" = true ]; then
              jq -r .status_markdown "$RUNNER_TEMP/factory-associate-result.json" > "$RUNNER_TEMP/factory-status.md"
              cid="$(jq -r '.status_comment_id // empty' "$RUNNER_TEMP/factory-associate-result.json")"
              if [ -n "$cid" ] && [ "$cid" != null ]; then
                jq -n --rawfile body "$RUNNER_TEMP/factory-status.md" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$cid" --input - >/dev/null
              fi
              echo "Recorded Cursor agent $agent_id on factory run $FACTORY_RUN_ID."
            else
              echo "Factory associate did not record agent $agent_id on factory run $FACTORY_RUN_ID ($(jq -r '.code // "unknown"' "$RUNNER_TEMP/factory-associate-result.json"))." >&2
            fi
          else
            echo "Factory associate did not record agent $agent_id on factory run $FACTORY_RUN_ID." >&2
          fi
          canonical_url="https://cursor.com/agents/$agent_id"
          comment_file="$RUNNER_TEMP/factory-agent-comment.md"
          {
            printf 'Cursor Cloud Agent API-verified: %s\n\n' "$canonical_url"
            printf 'Factory intake used the `factory:ready` label via Actions (Agents API).'
            if [ -n "$FACTORY_RUN_ID" ]; then printf ' Factory-Run-ID: `%s`.' "$FACTORY_RUN_ID"; fi
            if [ -n "$cursor_run_id" ]; then printf ' Cursor run: `%s`' "$cursor_run_id"; fi
            if [ -n "$run_status" ]; then printf ' (`%s`)' "$run_status"; fi
            printf '\n\nThe API key may belong to a service account, so whether this URL is visible in your personal Cursor dashboard depends on Cursor account access. Factory repair follows the API-verified agent ID, not browser visibility. Cursor run ids are not Factory Run IDs.\n\n'
            printf '<!-- factory-agent-id:%s -->\n' "$agent_id"
            if [ -n "$FACTORY_RUN_ID" ]; then printf '<!-- factory-run-id:%s -->\n' "$FACTORY_RUN_ID"; fi
          } > "$comment_file"
          gh issue comment "$ISSUE" --repo "$REPOSITORY" --body-file "$comment_file"
      - name: Record Codex handoff
        if: steps.gate.outputs.delegated == 'true' && steps.gate.outputs.provider == 'codex' && steps.plane.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPOSITORY" --add-label factory:delegated --remove-label factory:ready || true
