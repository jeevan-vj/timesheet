name: Factory Trusted Controller
on:
  workflow_run:
    workflows: [Factory PR Gate, Factory Review Signal]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: factory-controller-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted factory policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .factory
      - name: Evaluate live merge gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          ALLOW_HIGH_RISK: ${{ vars.FACTORY_ALLOW_HIGH_RISK_AUTOMERGE }}
        run: |
          set -euo pipefail
          pr="$(printf '%s' "$RUN_PRS" | jq -r '.[0].number // empty')"
          if [ -z "$pr" ]; then pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"; fi
          [ -n "$pr" ] || exit 0
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr")"
          head="$(printf '%s' "$pr_json" | jq -r .head.sha)"
          head_repo="$(printf '%s' "$pr_json" | jq -r .head.repo.full_name)"
          draft="$(printf '%s' "$pr_json" | jq -r .draft)"
          body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"
          [ "$head_repo" = "$REPOSITORY" ] || exit 0
          [ "$draft" = false ] || exit 0
          issue="$(printf '%s' "$body" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          [ -n "$issue" ] || exit 0
          delegated="$(gh api "repos/$REPOSITORY/issues/$issue" --jq '[.labels[].name] | any(. == "factory:delegated")')"
          [ "$delegated" = true ] || exit 0
          gate="$(gh api "repos/$REPOSITORY/commits/$head/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Factory deterministic gate" and .app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""')"
          [ "$gate" = success ] || exit 0
          files="$RUNNER_TEMP/files.txt"; gh api --paginate "repos/$REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[].filename' > "$files"
          risk="$(node .factory/classify-risk.mjs < "$files")"
          if [ "$risk" = protected ] || { [ "$risk" = high ] && [ "$ALLOW_HIGH_RISK" != true ]; }; then
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human || true
            gh pr comment "$pr" --repo "$REPOSITORY" --body "Factory verification passed, but **$risk-risk** changes require human approval."
            exit 0
          fi
          reviews="$RUNNER_TEMP/reviews.json"; gh api --paginate "repos/$REPOSITORY/pulls/$pr/reviews?per_page=100" | jq -s '[.[][]]' > "$reviews"
          latest="$(node --input-type=module -e 'import fs from "node:fs"; import {selectLatestFactoryReview} from "./.factory/review-bots.mjs"; process.stdout.write(JSON.stringify(selectLatestFactoryReview(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))||{}));' "$reviews")"
          review_id="$(printf '%s' "$latest" | jq -r '.id // empty')"
          review_head="$(printf '%s' "$latest" | jq -r '.commit_id // empty')"
          review_state="$(printf '%s' "$latest" | jq -r '.state // empty')"
          [ -n "$review_id" ] && [ "$review_head" = "$head" ] && [ "${review_state,,}" = approved ] || exit 0
          comments="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr/comments?per_page=100" | jq -s --argjson id "$review_id" '[.[][] | select(.pull_request_review_id == $id)] | length')"
          [ "$comments" -eq 0 ] || exit 0
          final_head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq .head.sha)"
          [ "$final_head" = "$head" ] || exit 0
          gh pr merge "$pr" --repo "$REPOSITORY" --auto --squash --delete-branch --match-head-commit "$head"
