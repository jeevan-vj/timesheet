name: Factory Trusted Controller
on:
  workflow_run:
    workflows: [Factory PR Gate, Factory Review Signal, Factory E2E Evidence, Factory Review Comment]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: factory-controller-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      checks: read
      actions: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted factory policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .factory
      - name: Evaluate live merge gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          pr=""
          if [ "${TRIGGER_WORKFLOW:-}" = "Factory Review Comment" ]; then
            comment_dir="$RUNNER_TEMP/factory-review-comment"
            rm -rf "$comment_dir"
            gh run download "$TRIGGER_RUN_ID" --repo "$REPOSITORY" --name factory-review-comment --dir "$comment_dir"
            pr="$(tr -d '[:space:]' < "$comment_dir/pr.txt")"
            case "$pr" in
              ''|*[!0-9]*) exit 0 ;;
            esac
          fi
          if [ -z "$pr" ]; then pr="$(printf '%s' "$RUN_PRS" | jq -r '.[0].number // empty')"; fi
          if [ -z "$pr" ]; then [ -n "$HEAD_BRANCH" ] || exit 0; pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"; fi
          [ -n "$pr" ] || exit 0
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr")"
          head="$(printf '%s' "$pr_json" | jq -r .head.sha)"
          head_repo="$(printf '%s' "$pr_json" | jq -r .head.repo.full_name)"
          draft="$(printf '%s' "$pr_json" | jq -r .draft)"
          body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"
          [ "$head_repo" = "$REPOSITORY" ] || exit 0
          [ "$draft" = false ] || exit 0
          [ "$(printf '%s' "$pr_json" | jq -r .state)" = open ] || exit 0
          [ "$(printf '%s' "$pr_json" | jq -r .merged)" = false ] || exit 0
          issue="$(printf '%s' "$body" | sed -nE 's/.*(Closes|Fixes|Resolves)[[:space:]]+#([0-9]+).*/\2/ip' | head -1)"
          [ -n "$issue" ] || exit 0
          delegated="$(gh api "repos/$REPOSITORY/issues/$issue" --jq '[.labels[].name] | any(. == "factory:delegated")')"
          [ "$delegated" = true ] || exit 0
          upsert_factory_status() {
            local plane_file="$1"
            [ "$(jq -r .ok "$plane_file")" = true ] || return 0
            jq -r .status_markdown "$plane_file" > "$RUNNER_TEMP/factory-status.md"
            local cid
            cid="$(jq -r '.status_comment_id // empty' "$plane_file")"
            if [ -n "$cid" ] && [ "$cid" != null ]; then
              jq -n --rawfile body "$RUNNER_TEMP/factory-status.md" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$cid" --input - >/dev/null
            fi
          }
          issue_comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$REPOSITORY/issues/$issue/comments?per_page=100" | jq -s '[.[][]]' > "$issue_comments"
          node .factory/control-plane.mjs parse "$issue_comments" > "$RUNNER_TEMP/factory-parse.json"
          if [ "$(jq -r .ok "$RUNNER_TEMP/factory-parse.json")" != true ]; then
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human || true
            marker="<!-- factory-missing-run:$head -->"
            pr_comments="$RUNNER_TEMP/pr-comments.json"
            gh api --paginate "repos/$REPOSITORY/issues/$pr/comments?per_page=100" | jq -s '[.[][]]' > "$pr_comments"
            existing="$(jq --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))] | length' "$pr_comments")"
            if [ "$existing" -eq 0 ]; then gh pr comment "$pr" --repo "$REPOSITORY" --body "Factory controller failed closed: no canonical Factory Run ID is persisted on trusted comments. Labels and workflow status are not the source of truth.\n\n$marker"; fi
            exit 0
          fi
          gate="$(gh api "repos/$REPOSITORY/commits/$head/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Factory deterministic gate" and .app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""')"
          [ "$gate" = success ] || exit 0
          jq -n --slurpfile comments "$issue_comments" --arg head "$head" --argjson pr "$pr" '{comments:($comments[0] // []), phase:"verifying", head_sha:$head, pull_request:$pr, actor:{type:"workflow",name:"Factory Trusted Controller",harness:"other"}}' > "$RUNNER_TEMP/factory-advance-verifying.json"
          node .factory/control-plane.mjs advance "$RUNNER_TEMP/factory-advance-verifying.json" > "$RUNNER_TEMP/factory-advance-verifying-plane.json"
          upsert_factory_status "$RUNNER_TEMP/factory-advance-verifying-plane.json"
          if [ "$(jq -r .ok "$RUNNER_TEMP/factory-advance-verifying-plane.json")" = true ]; then
            jq -r .status_markdown "$RUNNER_TEMP/factory-advance-verifying-plane.json" > "$RUNNER_TEMP/factory-status-current.md"
            gh api --paginate "repos/$REPOSITORY/issues/$issue/comments?per_page=100" | jq -s '[.[][]]' > "$issue_comments"
          fi
          e2e_check="$(gh api "repos/$REPOSITORY/commits/$head/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Factory E2E evidence" and .app.slug == "github-actions")] | sort_by(.started_at) | last')"
          e2e="$(printf '%s' "$e2e_check" | jq -r '.conclusion // empty')"
          [ "$e2e" = success ] || exit 0
          e2e_run_id="$(printf '%s' "$e2e_check" | jq -r '.html_url' | sed -nE 's#.*/actions/runs/([0-9]+).*#\1#p')"
          [ -n "$e2e_run_id" ] || exit 0
          evidence_dir="$RUNNER_TEMP/factory-e2e-evidence"
          rm -rf "$evidence_dir"
          if ! gh run download "$e2e_run_id" --repo "$REPOSITORY" --name "factory-e2e-evidence-$head" --dir "$evidence_dir"; then
            exit 0
          fi
          evidence_json="$RUNNER_TEMP/factory-e2e-eval.json"
          if ! node .factory/evaluate-e2e-evidence.mjs --repository "$REPOSITORY" --pr "$pr" --head-sha "$head" --artifact-dir "$evidence_dir" --run-conclusion success --run-head-sha "$head" --run-event pull_request --run-id "$e2e_run_id" > "$evidence_json"; then
            reasons="$(jq -r '.reasonCodes | join(", ")' "$evidence_json" 2>/dev/null || echo unknown_state)"
            gh api --paginate "repos/$REPOSITORY/issues/$issue/comments?per_page=100" | jq -s '[.[][]]' > "$RUNNER_TEMP/issue-comments.json"
            jq -n --slurpfile comments "$RUNNER_TEMP/issue-comments.json" --arg head "$head" --argjson pr "$pr" --arg message "$reasons" '{comments:($comments[0] // []), kind:"e2e_consumer", head_sha:$head, pull_request:$pr, message:$message, actor:{type:"workflow",name:"Factory Trusted Controller",harness:"other"}}' > "$RUNNER_TEMP/factory-controller-signal.json"
            node .factory/control-plane.mjs controller-signal "$RUNNER_TEMP/factory-controller-signal.json" > "$RUNNER_TEMP/factory-controller-plane.json" || true
            if [ "$(jq -r .ok "$RUNNER_TEMP/factory-controller-plane.json" 2>/dev/null)" = true ]; then
              jq -r .status_markdown "$RUNNER_TEMP/factory-controller-plane.json" > "$RUNNER_TEMP/factory-status.md"
              cid="$(jq -r '.status_comment_id // empty' "$RUNNER_TEMP/factory-controller-plane.json")"
              if [ -n "$cid" ] && [ "$cid" != null ]; then
                jq -n --rawfile body "$RUNNER_TEMP/factory-status.md" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$cid" --input - >/dev/null
              fi
            fi
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human || true
            marker="<!-- factory-e2e-eval:$head -->"
            pr_comments="$RUNNER_TEMP/pr-comments.json"
            gh api --paginate "repos/$REPOSITORY/issues/$pr/comments?per_page=100" | jq -s '[.[][]]' > "$pr_comments"
            existing="$(jq --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))] | length' "$pr_comments")"
            if [ "$existing" -eq 0 ]; then
              gh pr comment "$pr" --repo "$REPOSITORY" --body "Trusted E2E evidence evaluation failed for commit $head ($reasons). The PR is not verified. Human investigation is required because the producer check succeeded but the default-branch consumer rejected the artifacts.\n\n$marker"
            fi
            exit 0
          fi

          reviews="$RUNNER_TEMP/reviews.json"
          review_comments="$RUNNER_TEMP/review-comments.json"
          issue_comments="$RUNNER_TEMP/issue-comments.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$pr/reviews?per_page=100" | jq -s '[.[][]]' > "$reviews"
          gh api --paginate "repos/$REPOSITORY/pulls/$pr/comments?per_page=100" | jq -s '[.[][]]' > "$review_comments"
          gh api --paginate "repos/$REPOSITORY/issues/$pr/comments?per_page=100" | jq -s '[.[][]]' > "$RUNNER_TEMP/pr-comments.json"
          node --input-type=module -e 'import fs from "node:fs"; import {reviewsWithCodexComments} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const comments=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); fs.writeFileSync(process.argv[1], JSON.stringify(reviewsWithCodexComments(reviews, comments, process.argv[3])));' "$reviews" "$RUNNER_TEMP/pr-comments.json" "$head"
          gh api --paginate "repos/$REPOSITORY/issues/$issue/comments?per_page=100" | jq -s '[.[][]]' > "$issue_comments"
          jq -n --slurpfile comments "$issue_comments" --arg head "$head" --argjson pr "$pr" '{comments:($comments[0] // []), phase:"reviewing", head_sha:$head, pull_request:$pr, actor:{type:"workflow",name:"Factory Trusted Controller",harness:"other"}}' > "$RUNNER_TEMP/factory-advance-reviewing.json"
          node .factory/control-plane.mjs advance "$RUNNER_TEMP/factory-advance-reviewing.json" > "$RUNNER_TEMP/factory-advance-reviewing-plane.json"
          upsert_factory_status "$RUNNER_TEMP/factory-advance-reviewing-plane.json"
          gh api --paginate "repos/$REPOSITORY/issues/$issue/comments?per_page=100" | jq -s '[.[][]]' > "$issue_comments"

          current_review="$(node --input-type=module -e 'import fs from "node:fs"; import {selectLatestFactoryReview} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).filter((review)=>review.commit_id===process.argv[2]); process.stdout.write(JSON.stringify(selectLatestFactoryReview(reviews)||{}));' "$reviews" "$head")"
          current_review_id="$(printf '%s' "$current_review" | jq -r '.id // empty')"
          current_actionable="$(node --input-type=module -e 'import fs from "node:fs"; import {selectActionableFactoryReview} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const comments=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); process.stdout.write(JSON.stringify(selectActionableFactoryReview(reviews,comments,process.argv[3])||{}));' "$reviews" "$review_comments" "$head")"
          current_actionable_id="$(printf '%s' "$current_actionable" | jq -r '.id // empty')"
          repaired_head="$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | select((.body // "") | startswith("Automated repair cycle ") and contains(" dispatched.")) | (.body // "") | try capture("factory-repair:(?<head>[0-9a-fA-F]{40}):").head catch empty] | last // empty' "$issue_comments")"

          marker="<!-- factory-review-request:$head -->"
          pr_comments="$RUNNER_TEMP/pr-comments.json"
          requested="$(jq --arg marker "$marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | length' "$pr_comments")"
          review_action="$(node .factory/review-dispatch.mjs --review-id "$current_review_id" --requests "$requested")"
          if [ "$review_action" = request ]; then
            if [ -n "$repaired_head" ] && [ "$repaired_head" != "$head" ]; then
              blocking_ids="$(node --input-type=module -e 'import fs from "node:fs"; import {blockingFactoryReviewCommentIds} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).filter((review)=>review.commit_id===process.argv[3]); const comments=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); process.stdout.write(blockingFactoryReviewCommentIds(reviews,comments).join("\n"));' "$reviews" "$review_comments" "$repaired_head")"
              while IFS= read -r comment_id; do
                [ -n "$comment_id" ] || continue
                reply_marker="<!-- factory-review-thread:$head:$comment_id -->"
                replied="$(jq --argjson id "$comment_id" --arg marker "$reply_marker" '[.[] | select(.in_reply_to_id == $id and ((.body // "") | contains($marker)))] | length' "$review_comments")"
                if [ "$replied" -eq 0 ]; then
                  gh api --method POST "repos/$REPOSITORY/pulls/$pr/comments/$comment_id/replies" -f body="Factory repair produced commit $head, and the deterministic gate plus E2E evidence passed. A fresh independent review has been requested before this thread is resolved.\n\n$reply_marker" >/dev/null
                fi
              done <<< "$blocking_ids"
              printf -v review_request 'bugbot run\n\n@codex review\n\nFactory repair produced commit %s and the deterministic gate plus E2E evidence passed. Please independently re-review the current head before the factory proceeds.\n\n%s' "$head" "$marker"
            else
              printf -v review_request 'bugbot run\n\n@codex review\n\nThe deterministic gate and E2E evidence passed for commit %s, and no trusted independent review covers this head. Please independently review the current head before the factory proceeds.\n\n%s' "$head" "$marker"
            fi
            gh pr comment "$pr" --repo "$REPOSITORY" --body "$review_request"
          fi

          if [ "$review_action" = proceed ] && [ -n "$repaired_head" ] && [ "$repaired_head" != "$head" ]; then
            [ -z "$current_actionable_id" ] || exit 0
            blocking_ids_json="$(node --input-type=module -e 'import fs from "node:fs"; import {blockingFactoryReviewCommentIds} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).filter((review)=>review.commit_id===process.argv[3]); const comments=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); process.stdout.write(JSON.stringify(blockingFactoryReviewCommentIds(reviews,comments)));' "$reviews" "$review_comments" "$repaired_head")"
            owner="${REPOSITORY%%/*}"
            repo_name="${REPOSITORY#*/}"
            threads="$RUNNER_TEMP/review-threads.json"
            gh api graphql --paginate -f query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$pr){reviewThreads(first:100,after:$endCursor){nodes{id isResolved comments(first:1){nodes{databaseId}}} pageInfo{hasNextPage endCursor}}}}}' -f owner="$owner" -f name="$repo_name" -F pr="$pr" | jq -s '[.[].data.repository.pullRequest.reviewThreads.nodes[]]' > "$threads"
            jq -r --argjson ids "$blocking_ids_json" '.[] | select(.isResolved == false) | select((.comments.nodes[0].databaseId // 0) as $id | $ids | index($id)) | .id' "$threads" | while IFS= read -r thread_id; do
              [ -n "$thread_id" ] || continue
              gh api graphql -f query='mutation($thread:ID!){resolveReviewThread(input:{threadId:$thread}){thread{id isResolved}}}' -f thread="$thread_id" >/dev/null
            done
            gh issue edit "$issue" --repo "$REPOSITORY" --remove-label factory:needs-human >/dev/null 2>&1 || true
          fi

          files="$RUNNER_TEMP/files.txt"; gh api --paginate "repos/$REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[].filename' > "$files"
          risk="$(node .factory/classify-risk.mjs < "$files")"
          if [ "$risk" != low ]; then
            jq -n --slurpfile comments "$issue_comments" --arg risk "$risk" --arg head "$head" --argjson pr "$pr" '{comments:($comments[0] // []), risk:$risk, head_sha:$head, pull_request:$pr, actor:{type:"workflow",name:"Factory Trusted Controller",harness:"other"}}' > "$RUNNER_TEMP/factory-controller-signal.json"
            node .factory/control-plane.mjs controller-signal "$RUNNER_TEMP/factory-controller-signal.json" > "$RUNNER_TEMP/factory-controller-plane.json"
            if [ "$(jq -r .ok "$RUNNER_TEMP/factory-controller-plane.json")" = true ]; then
              jq -r .status_markdown "$RUNNER_TEMP/factory-controller-plane.json" > "$RUNNER_TEMP/factory-status.md"
              cid="$(jq -r '.status_comment_id // empty' "$RUNNER_TEMP/factory-controller-plane.json")"
              if [ -n "$cid" ] && [ "$cid" != null ]; then
                jq -n --rawfile body "$RUNNER_TEMP/factory-status.md" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$cid" --input - >/dev/null
              fi
            fi
            gh issue edit "$issue" --repo "$REPOSITORY" --add-label factory:needs-human || true
            marker="<!-- factory-human-gate:$head:$risk -->"
            pr_comments="$RUNNER_TEMP/pr-comments.json"
            gh api --paginate "repos/$REPOSITORY/issues/$pr/comments?per_page=100" | jq -s '[.[][]]' > "$pr_comments"
            existing="$(jq --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))] | length' "$pr_comments")"
            if [ "$existing" -eq 0 ]; then gh pr comment "$pr" --repo "$REPOSITORY" --body "Factory verification passed, but **$risk-risk** changes require human approval. Passing E2E evidence does not waive this gate.\n\n$marker"; fi
            exit 0
          fi
          if [ "$review_action" != proceed ]; then
            exit 0
          fi
          mergeable_review="$(node --input-type=module -e 'import fs from "node:fs"; import {selectMergeableFactoryReview} from "./.factory/review-bots.mjs"; const reviews=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const comments=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); process.stdout.write(JSON.stringify(selectMergeableFactoryReview(reviews,comments,process.argv[3])||{}));' "$reviews" "$review_comments" "$head")"
          mergeable_review_id="$(printf '%s' "$mergeable_review" | jq -r '.id // empty')"
          [ -n "$mergeable_review_id" ] || exit 0
          final_head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq .head.sha)"
          [ "$final_head" = "$head" ] || exit 0
          gh pr merge "$pr" --repo "$REPOSITORY" --auto --squash --delete-branch --match-head-commit "$head"
          jq -n --slurpfile comments "$issue_comments" --arg head "$head" --argjson pr "$pr" '{comments:($comments[0] // []), merged:true, risk:"low", head_sha:$head, pull_request:$pr, actor:{type:"workflow",name:"Factory Trusted Controller",harness:"other"}}' > "$RUNNER_TEMP/factory-controller-complete.json"
          node .factory/control-plane.mjs controller-signal "$RUNNER_TEMP/factory-controller-complete.json" > "$RUNNER_TEMP/factory-controller-complete-plane.json" || true
          if [ "$(jq -r .ok "$RUNNER_TEMP/factory-controller-complete-plane.json" 2>/dev/null)" = true ]; then
            jq -r .status_markdown "$RUNNER_TEMP/factory-controller-complete-plane.json" > "$RUNNER_TEMP/factory-status.md"
            cid="$(jq -r '.status_comment_id // empty' "$RUNNER_TEMP/factory-controller-complete-plane.json")"
            if [ -n "$cid" ] && [ "$cid" != null ]; then
              jq -n --rawfile body "$RUNNER_TEMP/factory-status.md" '{body:$body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$cid" --input - >/dev/null
            fi
          fi
