name: Preview on Cloudflare

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cleantrack-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  preview-config:
    name: preview-config
    needs: verify
    if: github.repository == 'jeevan-vj/timesheet'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check preview configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [ -z "${PREVIEW_D1_DATABASE_ID}" ] && missing+=("variable PREVIEW_D1_DATABASE_ID")
          [ -z "${PREVIEW_URL}" ] && missing+=("variable PREVIEW_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Preview deploy skipped"
              echo ""
              echo "This is not a successful preview deploy. \`deploy-preview\` is skipped until the repository has:"
              printf -- '- %s\n' "${missing[@]}"
              echo ""
              echo "Also set Worker secret BETTER_AUTH_SECRET on cleantrack-timesheet-preview in Cloudflare."
              echo "See docs/DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview deploy skipped::Preview configuration is missing. deploy-preview is skipped, not successful."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: deploy-preview
    needs: [verify, preview-config]
    if: needs.preview-config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy preview Worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-preview-wrangler.mjs dist/server/wrangler.json
          pnpm exec wrangler d1 migrations apply cleantrack-timesheet-preview --remote --config dist/server/wrangler.json
          pnpm exec wrangler deploy \
            --config dist/server/wrangler.json \
            --var "BETTER_AUTH_URL:${PREVIEW_URL}" \
            --var "AUTH_TRUSTED_ORIGINS:" \
            --var "RELEASE_SHA:${GITHUB_SHA}"
