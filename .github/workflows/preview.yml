name: Preview on Cloudflare

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cleantrack-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  deploy-preview:
    needs: verify
    if: github.repository == 'jeevan-vj/timesheet'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy preview Worker or report the missing configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [ -z "${PREVIEW_D1_DATABASE_ID}" ] && missing+=("variable PREVIEW_D1_DATABASE_ID")
          [ -z "${PREVIEW_URL}" ] && missing+=("variable PREVIEW_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Preview deploy skipped. Add these on the GitHub repository, not in Cursor:"
            printf ' - %s\n' "${missing[@]}"
            echo "Also set Worker secret BETTER_AUTH_SECRET on cleantrack-timesheet-preview in Cloudflare."
            echo "See docs/DEPLOYMENT.md."
            exit 0
          fi
          node scripts/prepare-preview-wrangler.mjs dist/server/wrangler.json
          pnpm exec wrangler d1 migrations apply cleantrack-timesheet-preview --remote --config dist/server/wrangler.json
          pnpm exec wrangler deploy \
            --config dist/server/wrangler.json \
            --var "BETTER_AUTH_URL:${PREVIEW_URL}" \
            --var "AUTH_TRUSTED_ORIGINS:" \
            --var "RELEASE_SHA:${GITHUB_SHA}"
